<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#031d36" />
      <stop offset="100%" stop-color="#022c4a" />
    </linearGradient>
    <linearGradient id="spiralGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#93c5fd" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#dc2626" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <filter id="cycloneGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#oceanBg)" />

  <!-- Atlantic Canada Coastline Outline (Nova Scotia, Newfoundland, Gulf of St. Lawrence) -->
  <path d="M 100,120 Q 220,100 300,160 Q 340,240 280,310 Q 200,340 180,420 Q 120,440 90,380 Z" fill="#1e293b" stroke="#475569" stroke-width="2" opacity="0.8" />
  <text x="180" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Nova Scotia</text>

  <!-- Newfoundland Island -->
  <path d="M 380,80 Q 480,50 540,110 Q 580,200 500,240 Q 420,220 380,160 Z" fill="#1e293b" stroke="#475569" stroke-width="2" opacity="0.8" />
  <text x="440" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Newfoundland</text>

  <!-- Isobar Pressure Rings (Deep Low 942 hPa) -->
  <g fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6">
    <ellipse cx="750" cy="360" rx="400" ry="240" stroke-dasharray="10,6" />
    <text x="1100" y="360" fill="#38bdf8" font-size="12" font-family="sans-serif">996 hPa</text>
    <ellipse cx="750" cy="360" rx="320" ry="190" stroke-dasharray="8,5" stroke="#0ea5e9" />
    <text x="1020" y="360" fill="#0ea5e9" font-size="12" font-family="sans-serif">980 hPa</text>
    <ellipse cx="750" cy="360" rx="240" ry="140" stroke-width="2.5" stroke="#f59e0b" />
    <text x="940" y="360" fill="#f59e0b" font-size="12" font-family="sans-serif">964 hPa</text>
    <ellipse cx="750" cy="360" rx="150" ry="90" stroke-width="3" stroke="#ef4444" />
    <text x="860" y="360" fill="#ef4444" font-size="12" font-family="sans-serif">948 hPa</text>
  </g>

  <!-- Massive Cloud Spiral Feeder Bands -->
  <g fill="none" stroke="url(#spiralGrad)" stroke-linecap="round" filter="url(#cycloneGlow)">
    <path d="M 750,360 C 650,220 400,200 250,340 C 180,420 220,560 380,600 C 600,660 880,580 980,420 C 1040,320 950,180 800,120 C 600,40 380,80 240,180" stroke-width="32" opacity="0.75" />
    <path d="M 750,360 C 820,440 960,420 1020,320 C 1080,220 980,120 860,100 C 680,80 500,160 420,280" stroke-width="22" opacity="0.85" />
    <path d="M 750,360 C 700,310 620,330 580,390 C 540,460 620,540 720,550 C 840,560 920,480 940,400" stroke-width="16" opacity="0.9" />
  </g>

  <!-- Eye of Bomb Cyclone -->
  <circle cx="750" cy="360" r="45" fill="url(#eyeGlow)" />
  <circle cx="750" cy="360" r="16" fill="#020617" stroke="#ef4444" stroke-width="3" />
  <text x="750" y="365" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="900">942 mb</text>

  <!-- Sable Island & Wave Buoy Data Pin -->
  <g transform="translate(320, 380)">
    <circle cx="0" cy="0" r="6" fill="#fbbf24" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="0" x2="40" y2="-40" stroke="#fbbf24" stroke-width="1.5" />
    <rect x="40" y="-70" width="220" height="55" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1" />
    <text x="50" y="-50" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="800">Sable Island Station (44.9°N)</text>
    <text x="50" y="-30" fill="#e2e8f0" font-family="sans-serif" font-size="11">Peak Gust: <tspan fill="#ef4444" font-weight="700">168 km/h</tspan> | Waves: <tspan fill="#38bdf8" font-weight="700">14.2 m</tspan></text>
  </g>

  <!-- Technical Overlay HUD -->
  <g transform="translate(50, 490)">
    <rect width="360" height="145" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5" />
    <text x="20" y="30" fill="#ef4444" font-family="system-ui, sans-serif" font-size="14" font-weight="800">BOMB CYCLOGENESIS METRICS</text>
    <text x="20" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Central Pressure Drop: <tspan fill="#ef4444" font-weight="700">-38 hPa in 24 hrs (1.6 Bergerons)</tspan></text>
    <text x="20" y="83" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">SST Thermal Gradient: <tspan fill="#38bdf8" font-weight="700">Gulf Stream (18°C) vs Labrador (2°C)</tspan></text>
    <text x="20" y="108" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Maximum Storm Surge: <tspan fill="#f59e0b" font-weight="700">+2.45m at Northumberland Strait</tspan></text>
    <text x="20" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Classification: <tspan fill="#ffffff" font-weight="700">Category 3 Equivalent Post-Tropical</tspan></text>
  </g>

  <text x="50" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="900">MARITIME BOMB CYCLONE &amp; NOR'EASTER DYNAMICS</text>
  <text x="50" y="82" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Ocean Wave Mechanics &amp; 940mb Barometric Drop over Atlantic Canada</text>
</svg>
