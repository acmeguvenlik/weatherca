<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="40%" stop-color="#0b132b" />
      <stop offset="80%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <radialGradient id="vortexGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <circle cx="600" cy="280" r="320" fill="url(#vortexGlow)" />

  <!-- Polar Grid Rings -->
  <circle cx="600" cy="280" r="240" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.4" />
  <circle cx="600" cy="280" r="160" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.6" />
  <circle cx="600" cy="280" r="80" fill="none" stroke="#67e8f9" stroke-width="2" opacity="0.8" />

  <!-- Rotating Polar Vortex Jet Stream Streams -->
  <path d="M 300 280 C 320 180, 480 120, 600 120 C 720 120, 880 180, 900 280 C 920 380, 760 440, 600 440 C 440 440, 280 380, 300 280 Z" 
        fill="none" stroke="url(#streamGrad)" stroke-width="6" filter="url(#glow)" />
  
  <!-- Displaced Arctic Lobe Spilling South into Prairies -->
  <path d="M 450 200 C 480 260, 520 380, 580 480 C 620 540, 680 500, 720 420 C 760 340, 750 240, 750 200" 
        fill="none" stroke="#e0f2fe" stroke-width="4" stroke-dasharray="8,6" opacity="0.9" filter="url(#glow)" />

  <!-- Arctic Ice Crystals Graphic -->
  <g fill="#bae6fd" opacity="0.7">
    <circle cx="200" cy="140" r="3" />
    <circle cx="280" cy="90" r="2" />
    <circle cx="850" cy="110" r="2.5" />
    <circle cx="950" cy="180" r="3" />
    <circle cx="150" cy="380" r="2" />
    <circle cx="1020" cy="360" r="2.5" />
    <circle cx="600" cy="50" r="4" />
  </g>

  <!-- Cold Core Center Pin -->
  <circle cx="600" cy="280" r="14" fill="#0284c7" />
  <circle cx="600" cy="280" r="8" fill="#ffffff" />
  <text x="600" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="2">ARCTIC HIGH CORE (-52°C)</text>

  <!-- Telemetry Overlay Badges -->
  <rect x="60" y="50" width="340" height="42" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.3" />
  <text x="80" y="76" font-family="monospace" font-size="14" font-weight="700" fill="#38bdf8">CANADIAN POLAR VORTEX DISPLACEMENT</text>

  <rect x="800" y="50" width="340" height="42" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.3" />
  <text x="820" y="76" font-family="monospace" font-size="14" font-weight="700" fill="#22c55e">ECCC STRATOSPHERIC MONITORING 2026</text>

  <!-- Big Title Block -->
  <text x="60" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-1">
    THE POLAR VORTEX DYNAMICS
  </text>
  <text x="60" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
    Meteorological Mechanics of Siberian Cold Plumes Across the Canadian Prairies (AB, SK, MB)
  </text>
</svg>
