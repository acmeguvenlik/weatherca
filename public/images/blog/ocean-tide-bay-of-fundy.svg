<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="tideHigh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.6)" />
      <stop offset="100%" stop-color="rgba(14, 165, 233, 0.1)" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#oceanBg)" />

  <!-- Bathymetric Funnel Contour (Bay of Fundy Basin) -->
  <path d="M 50,140 Q 300,200 650,230 L 650,260 Q 300,290 50,350 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />

  <!-- High Tide Level (16.3 Meters) -->
  <path d="M 50,160 Q 350,190 700,100 L 700,380 Q 350,300 50,330 Z" fill="url(#tideHigh)" stroke="#38bdf8" stroke-width="3" />
  
  <!-- Low Tide Contour (Mudflats Exposed) -->
  <path d="M 50,260 Q 350,270 700,340 L 700,380 Q 350,300 50,330 Z" fill="#78350f" opacity="0.7" stroke="#d97706" stroke-width="2" />

  <!-- Tidal Wave Oscillation Node and Antinode -->
  <line x1="100" y1="90" x2="100" y2="400" stroke="#64748b" stroke-dasharray="4,4" />
  <text x="105" y="105" fill="#94a3b8" font-size="11">Mouth: Atlantic Node (Δ 2.5m)</text>

  <line x1="680" y1="70" x2="680" y2="420" stroke="#f43f5e" stroke-dasharray="4,4" />
  <text x="560" y="85" fill="#f43f5e" font-size="11" font-weight="bold">Burntcoat Head Antinode (Δ 16.3m)</text>

  <!-- Tidal Amplitude Measurement Ruler -->
  <line x1="720" y1="100" x2="720" y2="340" stroke="#fbbf24" stroke-width="3" />
  <polygon points="720,95 715,108 725,108" fill="#fbbf24" />
  <polygon points="720,345 715,332 725,332" fill="#fbbf24" />
  <text x="735" y="225" fill="#fbbf24" font-size="13" font-weight="bold" font-family="monospace">16.3 m</text>

  <!-- Resonance Equation Box -->
  <rect x="50" y="50" width="310" height="90" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
  <text x="65" y="75" fill="#38bdf8" font-size="12" font-weight="bold">Hydrodynamic Resonance: T = 4L / √(gh)</text>
  <text x="65" y="95" fill="#cbd5e1" font-size="11">● Basin Length (L): ~270 km</text>
  <text x="65" y="112" fill="#cbd5e1" font-size="11">● Natural Period: ~12.5 hrs (Matches M2 Tide)</text>
  <text x="65" y="129" fill="#34d399" font-size="10">Co-oscillating resonance amplifies surge 6.5x</text>

  <!-- Title -->
  <text x="50" y="30" fill="#ffffff" font-size="14" font-weight="bold">BAY OF FUNDY TIDAL RESONANCE &amp; SEICHE AMPLIFICATION</text>
</svg>
