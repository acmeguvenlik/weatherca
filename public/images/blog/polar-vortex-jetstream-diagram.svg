<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Base Panel -->
  <rect width="1000" height="560" fill="url(#panelBg)" rx="24" stroke="#1e293b" stroke-width="2" />

  <!-- Left Side: Normal Zonal Flow -->
  <g transform="translate(40, 40)">
    <rect width="430" height="480" rx="18" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
    <text x="215" y="40" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#38bdf8" text-anchor="middle">
      PHASE 1: STABLE CIRCUMPOLAR FLOW
    </text>
    <text x="215" y="65" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">
      Strong Polar Night Jet Keeps Cold Confined to High Arctic
    </text>

    <!-- Concentric tight polar stream -->
    <ellipse cx="215" cy="240" rx="140" ry="110" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-dasharray="12,6" />
    <circle cx="215" cy="240" r="50" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2" />
    <text x="215" y="235" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">POLAR VORTEX</text>
    <text x="215" y="255" font-family="monospace" font-size="12" font-weight="700" fill="#bae6fd" text-anchor="middle">-55°C ARCTIC</text>

    <!-- Warm Air Outside -->
    <text x="215" y="400" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">
      Mid-Latitude Jet Stream acts as impenetrable wall
    </text>
    <text x="215" y="425" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
      Canadian Prairies experience normal seasonal temperatures (-10°C to -15°C)
    </text>
  </g>

  <!-- Right Side: Buckled Jet Stream (Sudden Stratospheric Warming Outbreak) -->
  <g transform="translate(530, 40)">
    <rect width="430" height="480" rx="18" fill="#020617" stroke="#dc2626" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="215" y="40" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#f87171" text-anchor="middle">
      PHASE 2: JET STREAM BUCKLING (SSW)
    </text>
    <text x="215" y="65" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">
      Omega Block Pushes Arctic Core Directly Into Prairies
    </text>

    <!-- Distorted Wavy Jet Stream -->
    <path d="M 60 180 C 100 80, 160 80, 200 160 C 230 220, 250 360, 280 400 C 310 430, 360 400, 370 280 C 380 200, 390 180, 410 180" 
          fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" />

    <!-- Displaced Siberian Lobe over Canada -->
    <ellipse cx="270" cy="300" rx="60" ry="50" fill="#1e1b4b" stroke="#818cf8" stroke-width="3" />
    <text x="270" y="295" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">ARCTIC OUTBREAK</text>
    <text x="270" y="315" font-family="monospace" font-size="13" font-weight="900" fill="#f87171" text-anchor="middle">-48°C / -60°C WC</text>

    <!-- Warm Ridge over Alaska / Pacific -->
    <path d="M 80 240 C 90 140, 150 120, 170 180" fill="none" stroke="url(#warmGrad)" stroke-width="4" stroke-dasharray="6,4" />
    <text x="140" y="115" font-family="sans-serif" font-size="11" font-weight="700" fill="#fb923c" text-anchor="middle">+15°C WARM RIDGE (AK)</text>

    <!-- Explanation text -->
    <text x="215" y="440" font-family="sans-serif" font-size="12" font-weight="600" fill="#fca5a5" text-anchor="middle">
      Deep trough digs into Edmonton, Calgary &amp; Regina
    </text>
    <text x="215" y="460" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">
      High winds produce lethal wind chills and power grid emergencies
    </text>
  </g>
</svg>
