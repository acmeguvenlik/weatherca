<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#051923" />
      <stop offset="100%" stop-color="#002b36" />
    </linearGradient>
    <linearGradient id="auroraGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="solarWindGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.1" cy="0.5" r="0.4">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Starfield -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="90" r="1.5" />
    <circle cx="210" cy="140" r="1" />
    <circle cx="340" cy="70" r="2" />
    <circle cx="490" cy="110" r="1" />
    <circle cx="620" cy="50" r="1.5" />
    <circle cx="780" cy="95" r="2" />
    <circle cx="910" cy="60" r="1" />
    <circle cx="1080" cy="130" r="1.5" />
    <circle cx="1150" cy="80" r="2" />
    <circle cx="150" cy="300" r="1" />
    <circle cx="850" cy="220" r="1.5" />
    <circle cx="1020" cy="270" r="1" />
    <circle cx="700" cy="320" r="1" />
    <circle cx="1120" cy="390" r="1.5" />
  </g>

  <!-- Solar Wind / CME Flux Lines -->
  <g stroke="url(#solarWindGrad)" stroke-width="2" opacity="0.75" stroke-dasharray="8,6">
    <path d="M 0,220 C 250,230 450,260 620,290" />
    <path d="M 0,280 C 280,285 480,310 630,335" />
    <path d="M 0,340 C 290,340 500,340 640,340" />
    <path d="M 0,400 C 280,395 480,370 630,345" />
    <path d="M 0,460 C 250,450 450,420 620,390" />
  </g>

  <!-- Solar Source Glow (Sun on left edge) -->
  <circle cx="0" cy="340" r="180" fill="url(#sunGlow)" />
  <text x="30" y="345" fill="#fef08a" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="2">SOLAR WIND (500-800 km/s CME FLUX)</text>

  <!-- Earth Magnetosphere Bow Shock -->
  <path d="M 560,80 C 440,200 440,480 560,600" fill="none" stroke="#38bdf8" stroke-width="4" filter="url(#glow)" opacity="0.85" />
  <text x="460" y="100" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Bow Shock Boundary</text>

  <!-- Magnetic Field Lines (Van Allen Belts) -->
  <g fill="none" stroke="#818cf8" stroke-width="2.5" opacity="0.8">
    <path d="M 800,310 C 700,200 620,180 620,340 C 620,500 700,480 800,370" />
    <path d="M 800,300 C 660,130 550,120 550,340 C 550,560 660,550 800,380" />
    <!-- Magnetotail Stretching East -->
    <path d="M 800,320 C 950,220 1150,240 1200,250" />
    <path d="M 800,360 C 950,460 1150,440 1200,430" />
  </g>

  <!-- Aurora Oval Ionosphere Emission (Curtain of Light) -->
  <path d="M 720,270 Q 770,220 840,240 T 930,220 Q 880,310 820,315 Z" fill="url(#auroraGrad)" filter="url(#glow)" />
  <path d="M 730,260 Q 800,200 870,225 T 950,210 Q 890,295 830,305 Z" fill="url(#auroraGrad)" opacity="0.7" />

  <!-- Planet Earth (Globe centered at 800,340) -->
  <circle cx="800" cy="340" r="55" fill="#0f172a" stroke="#0284c7" stroke-width="3" />
  <circle cx="800" cy="340" r="55" fill="#0369a1" opacity="0.35" />
  <!-- Continents contour (North America / Arctic) -->
  <path d="M 780,300 Q 800,295 820,305 Q 825,325 805,340 Q 775,335 770,315 Z" fill="#15803d" opacity="0.85" />
  <circle cx="800" cy="305" r="4" fill="#f43f5e" />
  <text x="815" y="308" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Yellowknife (62.45°N)</text>

  <!-- Technical Telemetry Badges -->
  <g transform="translate(60, 500)">
    <rect width="320" height="130" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5" />
    <text x="20" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="800">SPACE WEATHER METRICS</text>
    <text x="20" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Interplanetary Mag Field (IMF Bz): <tspan fill="#ef4444" font-weight="700">-15.4 nT (Southward)</tspan></text>
    <text x="20" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Geomagnetic Activity: <tspan fill="#22c55e" font-weight="700">Kp 7.33 (G3 Strong Storm)</tspan></text>
    <text x="20" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Auroral Oval Latitudinal Reach: <tspan fill="#f59e0b" font-weight="700">Down to 48.5°N (Edmonton/Winnipeg)</tspan></text>
  </g>

  <g transform="translate(800, 500)">
    <rect width="340" height="130" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5" />
    <text x="20" y="32" fill="#a855f7" font-family="system-ui, sans-serif" font-size="14" font-weight="800">ATOMIC EMISSION SPECTROSCOPY</text>
    <text x="20" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Atomic Oxygen (100-150km): <tspan fill="#22c55e" font-weight="700">557.7 nm (Emerald Green)</tspan></text>
    <text x="20" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">High-Altitude Oxygen (200-300km): <tspan fill="#ec4899" font-weight="700">630.0 nm (Crimson Red)</tspan></text>
    <text x="20" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Ionized Molecular Nitrogen: <tspan fill="#a855f7" font-weight="700">427.8 nm (Violet / Purple Fringe)</tspan></text>
  </g>

  <!-- Title overlay -->
  <text x="60" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="900" letter-spacing="-0.5">AURORAL ELECTROJET &amp; MAGNETOSPHERIC RECONNECTION</text>
  <text x="60" y="82" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Canadian Sub-Auroral Space Weather Diagnostic Model</text>
</svg>
