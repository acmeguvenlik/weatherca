<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#snowGrad)" />

  <!-- Snowpack Stratigraphy Layers (Mountain Slope Profile 35 deg) -->
  <!-- Ground Bedrock -->
  <polygon points="50,440 750,440 750,390 50,390" fill="#334155" />
  <text x="70" y="420" fill="#94a3b8" font-size="12" font-weight="bold">Alpine Bedrock Ground Surface (0 cm)</text>

  <!-- Depth Hoar (Basal Weak Layer) -->
  <polygon points="50,390 750,390 750,340 50,340" fill="#475569" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,2" />
  <text x="70" y="370" fill="#fca5a5" font-size="12" font-weight="bold">Depth Hoar / Cup Crystals (Basal Facets - High Instability)</text>

  <!-- Mid-Pack Consolidated Slab -->
  <polygon points="50,340 750,340 750,230 50,230" fill="#64748b" />
  <text x="70" y="290" fill="#f1f5f9" font-size="12">Dense Pencil Hard Wind Slab (P-Hardness, 380 kg/m³)</text>

  <!-- Buried Surface Hoar / Rain Crust Shear Plane -->
  <line x1="50" y1="230" x2="750" y2="230" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,3" />
  <polygon points="400,215 415,230 385,230" fill="#fbbf24" />
  <text x="430" y="225" fill="#fde047" font-size="12" font-weight="bold">CRITICAL FAILURE PLANE: Buried Surface Hoar Feathers</text>

  <!-- Storm Snow (Top Slab) -->
  <polygon points="50,230 750,230 750,130 50,130" fill="#94a3b8" />
  <text x="70" y="180" fill="#ffffff" font-size="12">Recent Storm Snow (4F-Hardness, 110 kg/m³ - 60cm New Load)</text>

  <!-- Fracture Crown Line -->
  <path d="M 620,130 L 620,230 L 750,230" fill="none" stroke="#ef4444" stroke-width="4" />
  <text x="540" y="120" fill="#ef4444" font-size="12" font-weight="bold">Crown Fracture (38° Slope)</text>

  <!-- Compression Test (CT/ECT) Result Box -->
  <rect x="50" y="45" width="280" height="75" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
  <text x="65" y="68" fill="#38bdf8" font-size="12" font-weight="bold">Avalanche Canada Snowpack Pit</text>
  <text x="65" y="88" fill="#cbd5e1" font-size="11">● ECTP12 @ 85cm (Sudden Collapse)</text>
  <text x="65" y="105" fill="#f43f5e" font-size="11">● Propagation Potential: HIGH</text>

  <!-- Title -->
  <text x="350" y="45" fill="#ffffff" font-size="14" font-weight="bold">SNOWPACK STRATIGRAPHY &amp; SLAB SHEAR MECHANICS</text>
  <text x="350" y="65" fill="#94a3b8" font-size="11">Columbia Mountains / Rogers Pass Avalanche Research</text>
</svg>
