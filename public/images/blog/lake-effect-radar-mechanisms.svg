<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="fetchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cloudUp" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#fetchBg)" rx="20" stroke="#1e293b" stroke-width="2" />

  <text x="50" y="50" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff">
    LAKE-EFFECT THERMODYNAMIC SNOW SQUALL GENERATOR
  </text>
  <text x="50" y="75" font-family="monospace" font-size="12" fill="#38bdf8">
    ΔT &gt; 13°C (850 hPa Temp vs Lake Surface Temp) + Long Unfrozen Fetch
  </text>

  <!-- Left: Frigid Arctic Inflow -->
  <g transform="translate(60, 150)">
    <rect width="240" height="260" rx="14" fill="#030712" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="120" y="35" font-family="sans-serif" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle">
      1. ARCTIC AIR MASS
    </text>
    <text x="120" y="60" font-family="monospace" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
      -22 °C (at 850 hPa)
    </text>
    <path d="M 40 130 L 190 130" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)" />
    <path d="M 40 160 L 190 160" stroke="#38bdf8" stroke-width="5" />
    <path d="M 40 190 L 190 190" stroke="#38bdf8" stroke-width="5" />
    <text x="120" y="235" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
      Dry, dense polar air blows across Georgian Bay / Huron
    </text>
  </g>

  <!-- Middle: Heat & Moisture Transfer from Unfrozen Lake -->
  <g transform="translate(350, 150)">
    <rect width="280" height="260" rx="14" fill="#082f49" stroke="#0284c7" stroke-width="1.5" />
    <text x="140" y="35" font-family="sans-serif" font-size="14" font-weight="800" fill="#7dd3fc" text-anchor="middle">
      2. OPEN WATER FETCH
    </text>
    <text x="140" y="60" font-family="monospace" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="middle">
      +4 °C LAKE WATER
    </text>
    <!-- Thermal Plumes rising -->
    <path d="M 60 210 Q 70 140, 80 100" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4" fill="none" />
    <path d="M 140 210 Q 140 140, 150 100" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4" fill="none" />
    <path d="M 220 210 Q 210 140, 220 100" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4" fill="none" />
    <text x="140" y="235" font-family="sans-serif" font-size="11" fill="#bae6fd" text-anchor="middle">
      Sensible &amp; latent heat transfers rapidly into boundary layer
    </text>
  </g>

  <!-- Right: Frictional Convergence & Torrential Snow Dumps on Shore -->
  <g transform="translate(680, 150)">
    <rect width="260" height="260" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
    <text x="130" y="35" font-family="sans-serif" font-size="14" font-weight="800" fill="#c084fc" text-anchor="middle">
      3. OROGRAPHIC DUMP
    </text>
    <text x="130" y="60" font-family="monospace" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">
      BARRIE / MUSKOKA
    </text>
    <circle cx="130" cy="130" r="40" fill="url(#cloudUp)" />
    <text x="130" y="135" font-family="monospace" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
      8-12 cm/hr
    </text>
    <text x="130" y="235" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">
      Land friction slows wind, forcing explosive vertical lifting
    </text>
  </g>
</svg>
